name: Dependabot auto-merge

# Auto-merge low-risk Dependabot PRs once required CI checks pass: patch and
# minor bumps of npm packages that are only development dependencies, and
# patch/minor bumps of GitHub Actions. Everything else is labelled
# `needs-review` and left for a human: npm packages that ship in the runtime
# image (they run next to every workspace's connector credentials), major
# updates, and Docker base-image bumps (e.g. node 22 → 25).
#
# Safety model:
#   - Uses `gh pr merge --auto`, which only fires once GitHub's required
#     status checks are green. This relies on branch protection being
#     configured on `main` with the CI jobs marked as required.
#   - Without branch protection, --auto still works but merges immediately
#     after CI without waiting for review. Still safer than today (nothing
#     gets merged at all) but less defensive.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Serialize the comment lookup/create pair across rebases of the same PR.
    concurrency:
      group: dependabot-triage-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to auto-merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          echo "update-type=$UPDATE_TYPE"
          echo "ecosystem=$ECOSYSTEM"
          echo "deps=$DEP_NAMES"

          # Default: do not auto-merge.
          AUTO=false
          REASON="default-deny"

          # Allow patch+minor for GitHub Actions, and for npm only when every
          # package in the PR (grouped PRs carry several) is a development
          # dependency. Runtime packages ("direct:production", "indirect")
          # are reviewed by a human.
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" \
             || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            if [[ "$ECOSYSTEM" == "github_actions" ]]; then
              AUTO=true
              REASON="patch-or-minor-github-action"
            elif [[ "$ECOSYSTEM" == "npm_and_yarn" ]]; then
              RUNTIME=$(jq -r '[.[] | select(.dependencyType != "direct:development") | .dependencyName] | join(", ")' <<<"${DEPS_JSON:-[]}")
              TOTAL=$(jq -r 'length' <<<"${DEPS_JSON:-[]}")
              if [[ "$TOTAL" -gt 0 && -z "$RUNTIME" ]]; then
                AUTO=true
                REASON="patch-or-minor-dev-dependencies-only"
              else
                REASON="runtime dependency ($RUNTIME)"
              fi
            else
              REASON="ecosystem-not-allowlisted ($ECOSYSTEM)"
            fi
          else
            REASON="not-patch-or-minor ($UPDATE_TYPE)"
          fi

          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # No review step: `main` requires 0 approving reviews, so approval is
          # unnecessary — and GitHub forbids GITHUB_TOKEN-backed Actions from
          # approving PRs ("GitHub Actions is not permitted to approve pull
          # requests"), which previously failed this step under `set -e` and
          # stopped the merge command from ever running.
          # `gh pr merge --auto` enables auto-merge; GitHub completes it once
          # the required Backend/Frontend checks pass and the branch is
          # up to date (Dependabot keeps its PRs rebased).
          gh pr merge --auto --squash "$PR_URL"

      - name: Label as needs-review
        if: steps.decide.outputs.auto != 'true'
        env:
          REVIEW_REASON: ${{ steps.decide.outputs.reason }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const reason = process.env.REVIEW_REASON;
            if (!reason) throw new Error('Missing auto-merge review reason');
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-review'] });
            } catch {
              core.warning('Could not add needs-review label; continuing with the review notice.');
            }
            const body = `Skipping auto-merge: ${reason}. A human should review this bump.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body === body
            )) {
              core.info('The same review reason is already posted.');
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
