name: Onboarding reminders cron

# Calls the cloud backend's onboarding endpoint
# (`/api/cron/onboarding-reminders`). The endpoint is idempotent: re-running
# within a window won't double-send because per-user counters, flags and timing
# checks are persisted.
#
# Cloud runs it every hour from a systemd timer on the droplet
# (anythingmcp-onboarding-cron.timer). This workflow is only a manual fallback
# (Actions → Run workflow), for example while the droplet timer is down. Its
# hourly schedule was removed in Nov 2026: with the timer, every pass ran twice
# and examined ~11k users twice for nothing.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override the onboarding-reminders URL (used for staging / dry-run)"
        required: false
        default: "https://cloud.anythingmcp.com/api/cron/onboarding-reminders"

jobs:
  trigger:
    name: Trigger onboarding drip
    runs-on: ubuntu-latest
    # A run takes 3 to 7 minutes on Cloud (Nov 2026) and holds a 30-minute
    # lease; 5 minutes cut runs and failed the job.
    timeout-minutes: 30
    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.ONBOARDING_CRON_SECRET }}
          TARGET_URL: ${{ inputs.target_url || 'https://cloud.anythingmcp.com/api/cron/onboarding-reminders' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::ONBOARDING_CRON_SECRET secret is not set on this repository."
            exit 1
          fi
          response_file="$(mktemp)"
          http_code=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            --max-time 1500 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${TARGET_URL}")
          echo "HTTP ${http_code}"
          cat "${response_file}"
          echo
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Onboarding cron endpoint returned ${http_code}"
            exit 1
          fi
