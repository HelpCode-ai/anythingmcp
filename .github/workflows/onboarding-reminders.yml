name: Onboarding reminders cron

# Pings the cloud backend every hour. The endpoint
# (`/api/cron/onboarding-reminders`) is idempotent — re-running within
# a window won't double-send because per-user counters, flags and timing
# checks are persisted.
#
# Hourly because the first nudge goes out an hour after sign-up, to people
# whose workspace is still empty (how to connect an app from the chat or the
# dashboard). The other passes (trial lifecycle, win-back, licence
# re-verification, release of deleted workspaces' licences) are gated by their
# own windows and flags, so running them more often sends nothing twice.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override the onboarding-reminders URL (used for staging / dry-run)"
        required: false
        default: "https://cloud.anythingmcp.com/api/cron/onboarding-reminders"

jobs:
  trigger:
    name: Trigger onboarding drip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.ONBOARDING_CRON_SECRET }}
          TARGET_URL: ${{ inputs.target_url || 'https://cloud.anythingmcp.com/api/cron/onboarding-reminders' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::ONBOARDING_CRON_SECRET secret is not set on this repository."
            exit 1
          fi
          response_file="$(mktemp)"
          http_code=$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${TARGET_URL}")
          echo "HTTP ${http_code}"
          cat "${response_file}"
          echo
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Onboarding cron endpoint returned ${http_code}"
            exit 1
          fi
